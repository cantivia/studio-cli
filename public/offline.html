<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio CLI</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #fff; color: #1d1d1f;
    font: 15px/1.5 Inter, -apple-system, system-ui, sans-serif; -webkit-app-region: drag; }
  .card { text-align: center; max-width: 420px; padding: 24px; }
  img { width: 88px; height: 88px; }
  h1 { font-size: 26px; letter-spacing: -0.02em; margin: 18px 0 6px; }
  p { color: #636366; margin: 0 0 18px; }
  code { display: inline-block; background: #0e0e0e; color: #f5f1e8; padding: 10px 14px; border-radius: 12px;
    font: 13px "JetBrains Mono", ui-monospace, Menlo, monospace; -webkit-app-region: no-drag; user-select: all; }
  button { margin-top: 18px; border: 0; background: #1d1d1f; color: #fff; border-radius: 999px; padding: 9px 20px;
    font: inherit; font-weight: 500; cursor: pointer; -webkit-app-region: no-drag; }
  button:hover { background: #6d28d9; }
</style></head>
<body><div class="card">
  <img src="/icon-192.png" alt="">
  <h1>Studio CLI isn't running</h1>
  <p>Start the local server. This page reloads on its own once it's up.</p>
  <code>cd ~/studio-cli &amp;&amp; npm run dev</code><br>
  <button onclick="location.reload()">Reload</button>
</div>
<script>
  // Plain fetches skip the service worker's navigation fallback, so this hits the real server.
  setInterval(() => fetch('/api/state', { cache: 'no-store' }).then((r) => r.ok && location.reload(), () => {}), 2000);
</script>
</body></html>
